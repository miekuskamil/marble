  /* ---------- primary action ---------- */

  /* ---------- timer ---------- */
  .timer-card{padding:24px 20px 18px;text-align:center}

  .ring-center .sub{font-size:.8rem;color:var(--ink-dim);margin-top:6px;text-transform:uppercase;letter-spacing:.12em}
  .timer-card.warn .ring-fg{stroke:var(--warn)}

  .timer-controls{display:flex;gap:10px;justify-content:center}
  .tbtn{flex:1;max-width:150px;border:1px solid var(--panel-line);border-top-color:#3c434f;background:var(--btn-raised);
    color:var(--ink);border-radius:14px;padding:13px 8px;font-size:.98rem;font-weight:600;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.06) inset}
  .tbtn:active{background:var(--bg2)}
  .tbtn:disabled{opacity:.45;cursor:default}
  .tbtn.stop{border-color:#6a3030;color:#ffb0b0}
  .timer-hint{font-size:.78rem;color:var(--ink-faint);margin-top:12px;min-height:1.1em}

  /* ---------- bank ---------- */
  .bank{padding:18px 20px}
  .bank h2{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 14px;font-weight:700}
  .bank-link{background:none;border:0;padding:4px 0;margin:-4px 0 10px;color:var(--ink-dim);cursor:pointer;

  .bar{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--panel-line)}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--glass-c),var(--glass-b),var(--glass-a));border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
  .bar-fill.done{background:linear-gradient(90deg,#2e8b6a,var(--good))}

  .bank > .goal-claim{width:100%;margin-top:10px}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(90,209,154,.5)}50%{box-shadow:0 0 0 8px rgba(90,209,154,0)}}
  .bank-empty{color:var(--ink-faint);font-size:.92rem;text-align:center;padding:6px 0}

  .spacer{flex:1}

  /* ---------- history ---------- */
  .history{margin-top:6px}

  .history summary::-webkit-details-marker{display:none}

  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--panel-line);font-size:.9rem}

  .hist-row .when{color:var(--ink-faint);font-size:.78rem;white-space:nowrap}

  /* ---------- dialogs (native <dialog>, bottom sheet) ---------- */
  dialog.sheet{
    position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;
    background:var(--bg2);color:var(--ink);

  dialog.sheet[open]{animation:rise .26s cubic-bezier(.2,.9,.3,1)}

  .sheet h2{margin:0 0 4px;font-size:1.3rem;outline:none}

  .field{margin-bottom:16px}
  .field-label{display:block;font-size:.82rem;color:var(--ink-dim);margin:0 0 8px;letter-spacing:.04em}
  .field input,.field textarea,.rate-item input,.goal-item input{
    width:100%;background:var(--bg);border:1px solid var(--panel-line);color:var(--ink);

  .row2{display:flex;gap:10px}
  .row2>*{flex:1}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:1.02rem;font-weight:700;cursor:pointer;background:var(--amber);color:#2a1500}

  /* balance + quick add (grown-ups) */
  .balance{display:flex;align-items:baseline;gap:10px;background:var(--bg);border:1px solid var(--panel-line);border-radius:16px;padding:14px 16px;margin:0 0 16px}
  .balance-n{font-family:Georgia,serif;font-size:2.2rem;color:var(--glass-a);line-height:1}
  .balance-k{color:var(--ink-dim)}
  .quick-add{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .quick-btn{border:0;border-radius:14px;padding:14px 0;font-size:1.1rem;font-weight:800;cursor:pointer;background:var(--amber);color:#2a1500}

  /* spend stepper */
  .act-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .act-chip{flex:1 1 auto;min-width:96px;border:1px solid var(--panel-line);border-top-color:#3c434f;background:var(--btn-raised);
    color:var(--ink);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:center;font-weight:600;font-size:1rem;
    box-shadow:0 2px 6px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.06) inset}
  .act-chip small{display:block;font-weight:600;font-size:.74rem;color:var(--ink-faint);margin-top:2px}
  .act-chip[aria-pressed="true"]{background:linear-gradient(160deg,var(--glass-a),var(--glass-b) 70%);color:#2a1500;border-top-color:var(--glass-a)}
  .act-chip[aria-pressed="true"] small{color:#5a3200}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--bg);border:1px solid var(--panel-line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
  .step-btn{width:60px;height:60px;flex:0 0 auto;border-radius:16px;border:1px solid var(--panel-line);border-top-color:#3c434f;background:var(--btn-raised);
    color:var(--ink);font-size:2rem;font-weight:700;line-height:1;cursor:pointer;font-family:Georgia,serif;
    box-shadow:0 2px 6px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.06) inset}
  .step-btn:active{background:var(--bg2)}
  .step-btn:disabled{opacity:.35;cursor:default}
  .step-mid{text-align:center;flex:1}
  .step-mins{font-family:Georgia,serif;font-size:2.5rem;line-height:1;color:var(--glass-a);font-variant-numeric:tabular-nums}
  .step-unit{font-size:.8rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
  .cost-line{text-align:center;font-size:1.05rem;margin:0 0 10px;color:var(--ink-dim)}
  .cost-line b{color:var(--glass-a)}
  .cost-marbles{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
  .cost-marbles i{width:18px;height:18px;border-radius:50%;display:inline-block;background:var(--marble);box-shadow:inset 1px 1px 2px rgba(255,255,255,.5)}
  .spare-btn{display:block;width:100%;margin:0 0 14px;padding:10px;border-radius:12px;border:1px dashed var(--glass-b);
    background:rgba(245,166,35,.08);color:var(--glass-a);font-weight:700;font-size:.92rem;cursor:pointer}
  .spare-btn[hidden]{display:none}
  .cost-warn{color:var(--bad);font-size:.9rem;margin-top:6px}

  /* pin pad */
  .pin-dots{display:flex;gap:14px;justify-content:center;margin:14px 0 16px}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-faint)}
  .pin-dot.on{background:var(--glass-b);border-color:var(--glass-b)}
  .pin-err{color:var(--bad);text-align:center;font-size:.9rem;min-height:1.3em;margin-bottom:10px}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key{background:var(--btn-raised);border:1px solid var(--panel-line);border-top-color:#3c434f;color:var(--ink);
    border-radius:14px;padding:18px;font-size:1.4rem;font-weight:600;cursor:pointer;font-family:Georgia,serif}
  .key:active{background:var(--bg)}
  .key:disabled{opacity:.35;cursor:default}
  .key.blank{background:none;border:0}

  /* editors */
  .rate-list{margin-bottom:10px}
  .rate-item,.goal-item{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .rate-item input.name,.goal-item input.gname{flex:1;min-width:0}
  .rate-item input.mins{width:92px;flex:0 0 auto}
  .goal-item input.gcost{width:74px;flex:0 0 auto}
  .del{background:none;border:0;color:var(--bad);font-size:1.4rem;width:44px;height:44px;flex:0 0 auto;cursor:pointer;border-radius:10px}
  .goal-saved{font-size:.78rem;color:var(--ink-faint);margin:-4px 0 12px 2px}
  .col-heads{display:flex;gap:8px;font-size:.74rem;color:var(--ink-faint);margin:0 0 6px 2px}
  .col-heads span:first-child{flex:1}

  .toast{
    position:fixed;inset:auto;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);
    margin:0;border:0;background:var(--good);color:#04241a;padding:13px 20px;border-radius:14px;font-weight:700;
    z-index:80;animation:fade .25s;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:.95rem;width:max-content;max-width:calc(100vw - 40px);text-align:center;
  }

  .splash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, #2b313c, var(--bg) 70%);animation:fade .3s;cursor:pointer}
  .splash .big-marble{width:130px;height:130px;border-radius:50%;background:var(--marble);
    box-shadow:inset 5px 5px 12px rgba(255,255,255,.5), 0 10px 34px rgba(245,166,35,.5);animation:bounce .7s cubic-bezier(.2,1.5,.4,1)}
  @keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .splash h2{font-size:2rem;margin:22px 0 6px;color:var(--glass-a)}
  .splash p{color:var(--ink-dim);margin:0}

  /* ---------- bottom tab bar ---------- */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
    width:calc(100% - 32px);max-width:456px;display:flex;gap:4px;padding:6px;z-index:40;
    background:rgba(26,30,38,.92);backdrop-filter:blur(16px);
    border:1px solid var(--panel-line);border-top-color:var(--panel-hi);border-radius:20px;
    box-shadow:0 12px 34px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06) inset}
  .tab{flex:1;min-width:0;position:relative;border:0;background:none;color:var(--ink-dim);cursor:pointer;border-radius:15px;
    padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;transition:color .2s, background .2s}
  .tab-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tab .ic{width:24px;height:24px;display:block}
  .tab .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:#2a1500;background:linear-gradient(160deg,var(--glass-a),var(--glass-b) 70%)}
  .tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;background:var(--good);color:#04241a;border-radius:9px;
    font-size:.66rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

  @media (max-width:360px){
    .tabbar{width:calc(100% - 20px);padding:4px;gap:2px}
    .app{padding-left:14px;padding-right:14px}
    .tab{font-size:.62rem;letter-spacing:-.01em}
  }

  /* ---------- usage ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:linear-gradient(180deg,var(--panel-hi),var(--panel) 40%);border:1px solid var(--panel-line);border-top-color:var(--panel-hi);border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.05) inset;padding:14px 6px;text-align:center;min-width:0}
  .stat .n{font-size:1.5rem;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .stat .n.green{color:var(--good)} .stat .n.amber{color:var(--glass-a)}
  .stat .k{font-size:.7rem;color:var(--ink-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .chart-card{padding:18px 14px 12px}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 4px 10px}
  .chart-head h3{margin:0;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
  .chart-head .big{font-size:1.05rem;color:var(--glass-a);font-weight:700;white-space:nowrap}
  .chart-svg{width:100%;display:block;overflow:visible}
  .chart-dot{fill:var(--glass-b);stroke:var(--bg2);stroke-width:2;pointer-events:none}
  .chart-dot.active{fill:var(--glass-a)}

  .chart-area{opacity:.16;pointer-events:none}

  .chart-ylabel{fill:var(--ink-faint);font-size:9px;text-anchor:end}

  .chart-tipbg{fill:var(--bg);stroke:var(--panel-line);pointer-events:none}
  .chart-help{font-size:.75rem;color:var(--ink-faint);text-align:center;margin-top:6px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important}
  }
</style>

<body>
<div class="app" id="app"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
/* ============================================================================
   MARBLES — vanilla single-file app, no build, no network.
     helpers   : pure utilities
     Store     : state + localStorage persistence + migration (single source of truth)
     Sound     : synthesized cues (Web Audio) + vibration
     WakeLock  : keeps the screen on while a timer runs so the alarm can fire
     Timer     : wall-clock session engine (pause budget, cues fired once)
     actions   : state transitions (spend, end, bank, refunds, PIN)
     views     : render() builds the page from state; the timer card updates in place
   ========================================================================== */

/* ----------------------------- helpers ------------------------------------ */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, cls, txt) => { const n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; };
function btn(cls, txt, onClick){ const b=el('button',cls,txt); b.type='button'; if(onClick) b.addEventListener('click',onClick); return b; }
const uid = () => Math.random().toString(36).slice(2,10);
const clamp = (n,lo,hi) => Math.max(lo, Math.min(hi, n));
const snap10 = m => clamp(Math.round((Number(m)||0)/10)*10, 10, 600);
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;
const costFor = (minutes, rate) => Math.max(1, Math.ceil(minutes / rate));

function fmtClock(sec){
  const neg = sec < 0, s = Math.abs(Math.round(sec));
  return (neg?'+':'') + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function fmtWhen(ts){
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(d.toDateString() === now.toDateString()) return 'Today ' + t;
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString() === y.toDateString()) return 'Yesterday ' + t;
  return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + t;
}
function b64enc(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(const b of bytes) bin+=String.fromCharCode(b); return btoa(bin); }
function b64dec(b64){ const bin=atob(String(b64).replace(/\s+/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0))); }

const PAUSE_BUDGET_SEC = 300;           // one pause pot per session: 5 minutes total
const PIN_MAX_FAILS    = 5;             // wrong tries before a lockout
const UNLOCK_GRACE_MS  = 3*60*1000;     // no re-typing the PIN for 3 min after unlocking
const DEFAULT_PIN      = '1234';
const MARBLES_SHOWN    = 12;

/* ----------------------------- Store -------------------------------------- */
const Store = (() => {
  const KEY = 'marbles.v1';
  const DEFAULTS = {
    v: 2,
    marbles: 0,
    pin: DEFAULT_PIN,
    setupDone: false,        // first-run PIN setup completed
    soundOn: true,
    activities: [ { id:'game', name:'Games', minutes:20 }, { id:'tv', name:'TV', minutes:30 } ],
    goals: [ { id:'movie', name:'Movie night', cost:5, saved:0 } ],
    history: [],             // {id,type,text,ts, minutes?, played?, delta?, from?}
    session: null,           // {label,totalSec,endTs,pauseStart,pauseLeftSec,rate,marbles,spendId,cues}
    pinFails: 0, lockUntil: 0, lockLevel: 0,
  };
  let state = structuredClone(DEFAULTS);

  function repairEvent(h){
    const f = { ...h };
    f.id = f.id || uid(); f.ts = Number(f.ts) || Date.now(); f.text = String(f.text || '');
    if(f.type==='spend'){
      if(f.minutes==null){ const m=/(\d+)\s*min/i.exec(f.text); f.minutes = m ? +m[1] : 0; }
      if(f.delta==null){ const m=/Spent\s+(\d+)/i.exec(f.text); f.delta = -(m ? +m[1] : 1); }
    }
    if(f.type==='earn'   && f.delta==null){ const m=/Added\s+(\d+)/i.exec(f.text);   f.delta = m ? +m[1] : 0; }
    if(f.type==='adjust' && f.delta==null){ const m=/Removed\s+(\d+)/i.exec(f.text); f.delta = -(m ? +m[1] : 0); }
    if(f.type==='save'   && f.delta==null) f.delta = -1;
    return f;
  }
  function migrateSession(ss){
    if(!ss || typeof ss!=='object') return null;
    const base = { label:String(ss.label||'Game time'), totalSec:Number(ss.totalSec)||600,
                   rate:Number(ss.rate)||0, marbles:Number(ss.marbles)||0, spendId:ss.spendId||null,
                   cues:(ss.cues && typeof ss.cues==='object') ? ss.cues : {} };
    if('pauseLeftSec' in ss){
      return { ...base, endTs:Number(ss.endTs), pauseStart: ss.pauseStart==null ? null : Number(ss.pauseStart),
               pauseLeftSec: clamp(Number(ss.pauseLeftSec)||0, 0, PAUSE_BUDGET_SEC) };
    }
    // v1 shape: {running, pausedLeft, endTs}
    const now = Date.now(), paused = ss.running === false;
    return { ...base, endTs: paused ? now + (Number(ss.pausedLeft)||0)*1000 : Number(ss.endTs),
             pauseStart: paused ? now : null, pauseLeftSec: PAUSE_BUDGET_SEC };
  }
  function migrate(src){
    const s = (src && typeof src==='object') ? src : {};
    const m = structuredClone(DEFAULTS);
    const oldV = Number(s.v) || 1;
    m.marbles   = Math.max(0, Math.floor(Number(s.marbles)||0));
    if(typeof s.pin==='string' && /^\d{4}$/.test(s.pin)) m.pin = s.pin;
    m.setupDone = oldV < 2 ? true : !!s.setupDone;   // existing installs skip first-run; default PIN is forced to change at unlock
    m.soundOn   = s.soundOn !== false;
    if(Array.isArray(s.activities) && s.activities.length){
      m.activities = s.activities.map(a => ({ id:String(a.id||uid()), name:String(a.name||'Activity').slice(0,30), minutes:snap10(a.minutes) }));
    }
    if(Array.isArray(s.goals)){
      m.goals = s.goals.map(g => { const cost=clamp(parseInt(g.cost,10)||1,1,99);
        return { id:String(g.id||uid()), name:String(g.name||'Reward').slice(0,40), cost, saved:clamp(parseInt(g.saved,10)||0,0,cost) }; });
    }
    if(Array.isArray(s.history)) m.history = s.history.slice(0,300).map(repairEvent);
    m.session   = migrateSession(s.session);
    m.pinFails  = Math.max(0, parseInt(s.pinFails,10)||0);
    m.lockUntil = Math.max(0, Number(s.lockUntil)||0);
    m.lockLevel = Math.max(0, parseInt(s.lockLevel,10)||0);
    return m;
  }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      state = raw ? migrate(JSON.parse(raw)) : structuredClone(DEFAULTS);
    }catch(e){ console.warn('load failed, using defaults', e); state = structuredClone(DEFAULTS); }
    return state;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed', e); } }
  return {
    get: () => state,
    update: fn => { fn(state); save(); },
    reset: () => { state = structuredClone(DEFAULTS); save(); },
    replace: obj => { state = migrate(obj); save(); },
    load, migrate, DEFAULTS,
  };
})();

function logEvent(type, text, meta={}){
  Store.update(s => {
    s.history.unshift({ id: uid(), type, text, ts: Date.now(), ...meta });
    if(s.history.length > 300) s.history.length = 300;
  });
}
function announce(msg){ const live=$('#live'); if(!live) return; live.textContent=''; setTimeout(()=>{ live.textContent=msg; }, 30); }

/* ----------------------------- Sound -------------------------------------- */
const Sound = (() => {
  let ctx = null;
  const on = () => Store.get().soundOn !== false;
  function unlock(){
    try{
      if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); }
      if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    }catch(e){ ctx = null; }
  }
  function tone(freq, start, dur, gain=0.15){
    if(!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    const t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
  return {
    unlock,
    warn(){     if(!on()) return; unlock(); tone(660,0,0.25,0.12); buzz(60); },
    lastCall(){ if(!on()) return; unlock(); tone(660,0,0.16,0.12); tone(880,0.18,0.2,0.12); buzz([50,60,50]); },
    end(){      if(!on()) return; unlock(); tone(523,0,0.22,0.16); tone(659,0.2,0.22,0.16); tone(784,0.4,0.42,0.18); buzz([120,80,120,80,200]); },
    ping(){     if(!on()) return; unlock(); tone(880,0,0.12,0.10); },
  };
})();

/* ----------------------------- WakeLock ----------------------------------- */
/* Background tabs/apps freeze JS timers, so the alarm can only ring while this
   screen is visible. Keep the screen awake while a session runs (not paused). */
const WakeLock = (() => {
  let sentinel = null, busy = false;
  async function sync(){
    if(busy) return; busy = true;
    try{
      const want = !!Store.get().session && !Timer.isPaused() && document.visibilityState === 'visible';
      if(want && !sentinel && 'wakeLock' in navigator){
        sentinel = await navigator.wakeLock.request('screen');
        sentinel.addEventListener('release', () => { sentinel = null; TimerView.update(); });
      } else if(!want && sentinel){
        const s = sentinel; sentinel = null; await s.release();
      }
    }catch(e){ sentinel = null; }
    finally{ busy = false; TimerView.update(); }
  }
  return { sync, active: () => !!sentinel };
})();

/* ----------------------------- Timer -------------------------------------- */
/* Wall-clock: time left = endTs - now, so locks/reloads can't drift it.
   Pause spends from a 5-minute pot; when the pot runs out the clock restarts itself. */
const Timer = (() => {
  let handle = null;
  function pauseUsedSec(ss, now=Date.now()){ return ss.pauseStart==null ? 0 : Math.min((now-ss.pauseStart)/1000, ss.pauseLeftSec); }
  function settle(ss, now=Date.now()){            // turn an expired pause into a normal running session
    if(ss && ss.pauseStart!=null && (now-ss.pauseStart)/1000 >= ss.pauseLeftSec){
      ss.endTs += ss.pauseLeftSec*1000; ss.pauseLeftSec = 0; ss.pauseStart = null; return true;
    }
    return false;
  }
  function isPaused(){ const ss=Store.get().session; return !!(ss && ss.pauseStart!=null && (Date.now()-ss.pauseStart)/1000 < ss.pauseLeftSec); }
  function secondsLeft(){
    const ss = Store.get().session; if(!ss) return null;
    const now = Date.now();
    if(ss.pauseStart!=null) return Math.round((ss.endTs + pauseUsedSec(ss,now)*1000 - now)/1000);
    return Math.round((ss.endTs - now)/1000);
  }
  function pauseRemaining(){
    const ss = Store.get().session; if(!ss) return 0;
    return Math.max(0, Math.round(ss.pauseLeftSec - pauseUsedSec(ss)));
  }
  function start({label, totalSec, rate, marbles, spendId}){
    Store.update(s => { s.session = { label, totalSec, rate, marbles, spendId, endTs: Date.now()+totalSec*1000,
                                      pauseStart:null, pauseLeftSec:PAUSE_BUDGET_SEC, cues:{} }; });
    ensureLoop(); WakeLock.sync();
  }
  function pause(){
    let ok = false;
    Store.update(s => { const ss=s.session; if(!ss) return; settle(ss);
      if(ss.pauseStart!=null || ss.pauseLeftSec<=0 || secondsLeft()<=0) return; ss.pauseStart = Date.now(); ok = true; });
    if(ok) announce('Paused'); WakeLock.sync(); return ok;
  }
  function resume(){
    Store.update(s => { const ss=s.session; if(!ss || ss.pauseStart==null) return; if(settle(ss)) return;
      const used = pauseUsedSec(ss); ss.endTs += used*1000; ss.pauseLeftSec = Math.max(0, ss.pauseLeftSec-used); ss.pauseStart = null; });
    WakeLock.sync();
  }
  function stop(){ Store.update(s => { s.session = null; }); ensureLoop(); WakeLock.sync(); }
  function dueCue(ss, left){                       // most urgent threshold passed and not yet played
    const c = ss.cues || {};
    if(left<=0  && !c.end)  return 'end';
    if(left<=10 && !c.last) return 'last';
    if(left<=60 && !c.warn) return 'warn';
    return null;
  }
  function tick(){
    const ss = Store.get().session;
    if(!ss){ ensureLoop(); return; }
    if(ss.pauseStart!=null && (Date.now()-ss.pauseStart)/1000 >= ss.pauseLeftSec){
      Store.update(s => settle(s.session)); announce('Pause over. Clock restarted.'); WakeLock.sync();
    }
    if(!isPaused()){
      const cue = dueCue(ss, secondsLeft());
      if(cue){
        // Mark this cue and every quieter one as played: coming back from the background
        // plays only the most urgent sound instead of all three at once.
        Store.update(s => { const c = s.session.cues = s.session.cues || {};
          c.warn = true; if(cue!=='warn') c.last = true; if(cue==='end') c.end = true; });
        if(cue==='end'){ Sound.end(); announce('Time is up'); }
        else if(cue==='last'){ Sound.lastCall(); announce('10 seconds left'); }
        else { Sound.warn(); announce('1 minute left'); }
      }
    }
    TimerView.update();
  }
  function ensureLoop(){
    const active = !!Store.get().session;
    if(active && !handle) handle = setInterval(tick, 1000);
    if(!active && handle){ clearInterval(handle); handle = null; }
  }
  return { start, pause, resume, stop, tick, ensureLoop, secondsLeft, pauseRemaining, isPaused, settle };
})();

/* ----------------------------- actions ------------------------------------ */
/* Cost is always computed here from the activity's rate — never trusted from the caller. */
function spendMarble(activity, minutes){
  const s = Store.get();
  if(s.session) return false;
  const act  = activity || s.activities[0];
  const rate = snap10(act.minutes);
  minutes    = snap10(minutes==null ? rate : minutes);
  const cost = costFor(minutes, rate);
  if(cost > s.marbles) return false;
  const spendId = uid();
  Store.update(st => { st.marbles -= cost; });
  logEvent('spend', `Spent ${plural(cost,'marble')} → ${minutes} min of ${act.name}`, { id:spendId, minutes, delta:-cost, activity:act.name });
  Sound.unlock(); Sound.ping();
  Timer.start({ label:act.name, totalSec:minutes*60, rate, marbles:cost, spendId });
  closeSheet(); render();
  return true;
}

/* Whole marbles for unused time come back; minutes actually played are recorded. */
function endSession(){
  const ss = Store.get().session; if(!ss) return;
  const left   = Timer.secondsLeft();
  const played = Math.max(0, Math.round((ss.totalSec - left)/60));
  const refund = (left > 0 && ss.rate > 0) ? Math.min(ss.marbles||0, Math.floor(left/(ss.rate*60))) : 0;
  Store.update(st => {
    const ev = st.history.find(h => h.id === ss.spendId); if(ev) ev.played = played;
    st.marbles += refund; st.session = null;
  });
  if(refund) logEvent('refund', `Got ${plural(refund,'marble')} back (stopped early)`, { delta:refund, from:'session' });
  Timer.ensureLoop(); WakeLock.sync(); render();
  if(refund) toast(`${plural(refund,'marble')} back in your pot`);
}

function addToBank(goalId){
  const s = Store.get(); const g = s.goals.find(x => x.id===goalId);
  if(s.marbles <= 0 || !g || g.saved >= g.cost) return false;
  Store.update(st => { st.marbles -= 1; st.goals.find(x => x.id===goalId).saved += 1; });
  logEvent('save', `Banked 1 marble → ${g.name} (${g.saved}/${g.cost})`, { delta:-1 });
  Sound.ping(); render(); return true;
}
function withdrawFromGoal(goalId){
  const g = Store.get().goals.find(x => x.id===goalId);
  if(!g || g.saved <= 0) return false;
  Store.update(st => { st.goals.find(x => x.id===goalId).saved -= 1; st.marbles += 1; });
  logEvent('refund', `Took 1 marble back from ${g.name}`, { delta:1, from:'goal' });
  render(); return true;
}
function claimGoal(goalId){
  const g = Store.get().goals.find(x => x.id===goalId);
  if(!g || g.saved < g.cost) return false;
  Store.update(st => { st.goals.find(x => x.id===goalId).saved = 0; });
  logEvent('claim', `Claimed reward: ${g.name}`);
  showSplash('Reward unlocked!', g.name); render(); return true;
}
/* Saving the goals editor never destroys marbles: deleted goals and lowered costs refund the difference. */
function applyGoals(draft){
  const s = Store.get(); const prev = new Map(s.goals.map(g => [g.id, g]));
  const clean = draft.filter(g => String(g.name||'').trim()).map(g => {
    const cost = clamp(parseInt(g.cost,10)||1, 1, 99); const old = prev.get(g.id);
    return { id:g.id||uid(), name:String(g.name).trim().slice(0,40), cost, saved: old ? Math.min(old.saved, cost) : 0 };
  });
  const refund = s.goals.reduce((a,g) => a+g.saved, 0) - clean.reduce((a,g) => a+g.saved, 0);
  Store.update(st => { st.goals = clean; st.marbles += Math.max(0, refund); });
  if(refund > 0) logEvent('refund', `${plural(refund,'marble')} returned from goals`, { delta:refund, from:'goal' });
  return Math.max(0, refund);
}
function applyActivities(draft){
  const clean = draft.filter(a => String(a.name||'').trim())
    .map(a => ({ id:a.id||uid(), name:String(a.name).trim().slice(0,30), minutes:snap10(a.minutes) }));
  Store.update(st => { st.activities = clean.length ? clean : structuredClone(Store.DEFAULTS.activities); });
}
function grantMarbles(n){
  n = clamp(parseInt(n,10)||0, 0, 999); if(n<=0) return false;
  Store.update(s => { s.marbles += n; });
  logEvent('earn', `Added ${plural(n,'marble')}`, { delta:n });
  render(); return true;
}
function removeMarbles(n){
  const s = Store.get(); n = clamp(parseInt(n,10)||0, 0, s.marbles); if(n<=0) return false;
  Store.update(st => { st.marbles -= n; });
  logEvent('adjust', `Removed ${plural(n,'marble')}`, { delta:-n });
  render(); return true;
}

/* backup never contains the PIN or lock state */
function backupCode(){
  const s = Store.get();
  return b64enc(JSON.stringify({ v:s.v, marbles:s.marbles, soundOn:s.soundOn, activities:s.activities,
                                 goals:s.goals, history:s.history, exportedAt:Date.now() }));
}
function parseBackup(code){
  try{
    const obj = JSON.parse(b64dec(String(code).trim()));
    if(!obj || typeof obj!=='object' || typeof obj.marbles!=='number' || obj.marbles<0) return { ok:false, error:'This is not a Marbles backup code.' };
    return { ok:true, data:obj };
  }catch(e){ return { ok:false, error:'That code is broken or incomplete.' }; }
}
function applyRestore(obj){
  const cur = Store.get();
  Store.replace({ ...obj, v:2, pin:cur.pin, setupDone:true, session:null, pinFails:0, lockUntil:0, lockLevel:0 });
  Timer.ensureLoop(); WakeLock.sync(); render();
}

/* ----------------------------- views -------------------------------------- */
let TAB = 'home';            // 'home' | 'bank' | 'usage'
let LAST_SHOWN = null;       // marbles drawn last render → only new ones animate in
let ACTIVE_POINT = null;     // selected chart day
let CHART_ANIM = true;       // draw-in animation only when entering Usage
let HIST_OPEN = false;
let UNLOCKED_UNTIL = 0;      // PIN grace window (memory only)

function render(){
  Timer.ensureLoop();
  TimerView.reset();
  const s = Store.get();
  const main = el('main','view');
  if(TAB==='home')  renderHome(main, s);
  if(TAB==='bank')  renderBankView(main, s);
  if(TAB==='usage') renderUsageView(main, s);
  $('#app').replaceChildren(main, el('div','spacer'), renderTabbar(s));
}

function renderHome(main, s){
  const top = el('header','top'); const brand = el('div','brand');
  brand.append(el('span','dot'), el('h1','display','Marbles')); top.append(brand); main.append(top);

  const hero = el('section','hero'); hero.setAttribute('aria-label','Your marbles');
  hero.append(el('div','label','You have'));
  const row = el('div','marble-row'); row.setAttribute('role','img'); row.setAttribute('aria-label', plural(s.marbles,'marble'));
  if(!s.marbles) row.append(el('div','marble-none','No marbles yet. Earn one at home!'));
  else{
    const shown = Math.min(s.marbles, MARBLES_SHOWN);
    const prev  = LAST_SHOWN==null ? 0 : Math.min(LAST_SHOWN, MARBLES_SHOWN);
    for(let i=0;i<shown;i++){ const m = el('div','marble'); if(i<prev) m.classList.add('still'); else m.style.animationDelay = ((i-prev)*0.04)+'s'; row.append(m); }
    if(s.marbles > MARBLES_SHOWN) row.append(el('div','marble-more', '+'+(s.marbles-MARBLES_SHOWN)));
  }
  LAST_SHOWN = s.marbles;
  hero.append(row);
  const c = el('div','count'); c.innerHTML = `<b>${s.marbles}</b> ${s.marbles===1?'marble':'marbles'} to spend`;
  hero.append(c); main.append(hero);

  const spend = btn('spend-btn', null, openSpend);
  if(s.session){ spend.disabled = true; spend.textContent = 'Timer is running'; }
  else if(!s.marbles){ spend.disabled = true; spend.textContent = 'No marbles to spend'; }
  else spend.innerHTML = 'Spend marbles<small>Pick what to play and for how long</small>';
  main.append(spend);

  main.append(TimerView.build());
  if(s.goals.length) main.append(renderBank(true));
}

function renderBankView(main, s){
  main.append(el('h2','view-title','Savings bank'));
  main.append(el('p','view-sub', `${plural(s.marbles,'marble')} to spend or save`));
  main.append(renderBank(false));
}

function renderBank(compact){
  const s = Store.get(); const bank = el('section','bank');
  if(compact){ const h = btn('bank-link', null, () => { TAB='bank'; render(); }); h.innerHTML = 'Savings bank <span aria-hidden="true">→</span>'; bank.append(h); }
  else bank.append(el('h2', null, 'Save marbles for a big reward'));
  if(!s.goals.length){ bank.append(el('div','bank-empty','No goals yet. A grown-up can add one.')); return bank; }

  (compact ? s.goals.slice(0,1) : s.goals).forEach(g => {
    const done = g.saved >= g.cost;
    const wrap = el('div','goal');
    const t = el('div','goal-top');
    t.append(el('div','goal-name', g.name), el('div','goal-count'+(done?' done':''), done ? 'Ready!' : `${g.saved} / ${g.cost}`));
    wrap.append(t);
    const bar = el('div','bar'); bar.setAttribute('role','progressbar'); bar.setAttribute('aria-label', g.name);
    bar.setAttribute('aria-valuemin','0'); bar.setAttribute('aria-valuemax', String(g.cost)); bar.setAttribute('aria-valuenow', String(g.saved));
    const fill = el('div','bar-fill'+(done?' done':'')); fill.style.width = clamp(g.saved/g.cost*100,0,100)+'%';
    bar.append(fill); wrap.append(bar);
    if(compact){
      if(done) wrap.append(Object.assign(btn('goal-claim', `Claim ${g.name}`, () => claimGoal(g.id)), { style:'width:100%;margin-top:10px' }));
    } else {
      const actions = el('div','goal-actions');
      if(done) actions.append(btn('goal-claim', `Claim ${g.name}`, () => claimGoal(g.id)));
      else { const add = btn('goal-add', s.marbles>0 ? 'Add a marble' : 'No marbles to add', () => addToBank(g.id)); add.disabled = s.marbles<=0; actions.append(add); }
      if(g.saved > 0){ const back = btn('goal-back', 'Take 1 back', () => withdrawFromGoal(g.id)); back.setAttribute('aria-label', `Take one marble back from ${g.name}`); actions.append(back); }
      wrap.append(actions);
    }
    bank.append(wrap);
  });
  if(compact && s.goals.length > 1) bank.append(btn('bank-more', `+${plural(s.goals.length-1,'more goal')}`, () => { TAB='bank'; render(); }));
  return bank;
}

function renderTabbar(s){
  const nav = el('nav','tabbar'); nav.setAttribute('aria-label','Main');
  const ready = s.goals.filter(g => g.saved >= g.cost).length;

    home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',

    usage:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 4-6"/></svg>',

/* Timer card: built once per render, then updated in place every second
   (no full re-render → no replayed animations, the ring glides smoothly). */
const TimerView = (() => {
  let refs = null;
  function build(){
    const ss = Store.get().session;
    const card = el('section','timer-card'); card.setAttribute('aria-label','Game timer');
    if(!ss){ card.classList.add('hidden'); refs = null; return card; }
    const R = 90, C = 2*Math.PI*R;
    const wrap = el('div','ring-wrap');
    wrap.innerHTML = `<svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true"><circle class="ring-bg" cx="105" cy="105" r="${R}"/><circle class="ring-fg" cx="105" cy="105" r="${R}" stroke-dasharray="${C}"/></svg>`;
    const center = el('div','ring-center');
    const time = el('div','time display'); time.setAttribute('role','timer'); time.setAttribute('aria-live','off');
    const sub = el('div','sub'); center.append(time, sub); wrap.append(center); card.append(wrap);
    const note = el('div','over-note'); card.append(note);
    const ctrls = el('div','timer-controls');
    const pauseBtn = btn('tbtn', 'Pause', () => { Timer.isPaused() ? Timer.resume() : Timer.pause(); update(); });
    const done = btn('tbtn stop', 'Done', confirmEnd);
    ctrls.append(pauseBtn, done); card.append(ctrls);
    const hint = el('div','timer-hint'); card.append(hint);
    refs = { card, ring: wrap.querySelector('.ring-fg'), C, time, sub, note, pauseBtn, hint };
    update();
    return card;
  }
  function update(){
    if(!refs) return;
    const ss = Store.get().session; if(!ss) return;
    const left = Timer.secondsLeft(), paused = Timer.isPaused(), pr = Timer.pauseRemaining();
    const over = left < 0 || (left === 0 && ss.cues && ss.cues.end);
    refs.card.classList.toggle('over', over);
    refs.card.classList.toggle('warn', !over && left <= 60 && !paused);
    refs.card.classList.toggle('paused', paused);
    refs.ring.style.strokeDashoffset = String(refs.C * (1 - clamp(left/ss.totalSec, 0, 1)));
    refs.time.textContent = fmtClock(left);
    refs.sub.textContent  = over ? 'Over time' : paused ? 'Paused' : ss.label;
    refs.note.textContent = over ? 'Time is up. Tap Done.' : '';
    refs.pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    refs.pauseBtn.disabled = !paused && (over || pr <= 0);
    refs.pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
    let hint;
    if(paused)    hint = `Clock restarts by itself in ${fmtClock(pr)}`;
    else if(over) hint = '';
    else {
      const p = pr > 0 ? `Pause up to ${Math.ceil(pr/60)} min` : 'Pause used up';
      hint = p + ' · ' + (WakeLock.active() ? 'screen stays on' : 'keep this screen open for the alarm');
    }
    refs.hint.textContent = hint;
  }
  return { build, update, reset: () => { refs = null; } };
})();

function confirmEnd(){
  const ss = Store.get().session; if(!ss) return;
  const left = Timer.secondsLeft();
  if(left <= 0){ endSession(); return; }
  const refund = ss.rate ? Math.min(ss.marbles||0, Math.floor(left/(ss.rate*60))) : 0;
  confirmSheet({
    title: 'Stop now?',
    body: `${Math.ceil(left/60)} min left. ` + (refund ? `You get ${plural(refund,'marble')} back.` : 'The time left is lost.'),
    yes: 'Stop now', no: 'Keep playing', danger: true, onYes: endSession,
  });
}

/* ----------------------------- usage view --------------------------------- */
function dailyBuckets(history, days=14){
  const now = new Date(); const out = []; const index = new Map();
  for(let i=days-1;i>=0;i--){
    const d = new Date(now); d.setDate(now.getDate()-i); d.setHours(0,0,0,0);
    index.set(d.getTime(), out.length); out.push({ date:d, minutes:0, earned:0, spent:0 });
  }
  const startTs = out[0].date.getTime();
  history.forEach(h => {
    if(h.ts < startTs) return;
    const d = new Date(h.ts); d.setHours(0,0,0,0);
    const i = index.get(d.getTime()); if(i==null) return;
    const b = out[i];
    if(h.type==='spend'){ b.minutes += (h.played!=null ? h.played : (h.minutes||0)); b.spent += Math.abs(h.delta||1); }
    else if(h.type==='refund' && h.from==='session'){ b.spent -= (h.delta||0); }
    else if(h.type==='earn'){ b.earned += (h.delta||0); }
  });
  return out;
}

function renderUsageView(main, s){
  main.append(el('h2','view-title','Usage'));
  main.append(el('p','view-sub','Last 14 days'));
  const buckets = dailyBuckets(s.history, 14);
  const totalMin = buckets.reduce((a,b) => a+b.minutes, 0);
  const playDays = buckets.filter(b => b.minutes > 0).length;
  const avg = playDays ? Math.round(totalMin/playDays) : 0;
  const earned = buckets.reduce((a,b) => a+b.earned, 0);
  const spent  = buckets.reduce((a,b) => a+b.spent, 0);

  const stats = el('div','stat-row');
  const mk = (n,k,cls) => { const w = el('div','stat'); w.append(el('div','n'+(cls?' '+cls:''), String(n)), el('div','k',k)); return w; };
  stats.append(mk(totalMin,'minutes'), mk(avg,'avg / day','amber'), mk(`${earned}/${spent}`,'in / out','green'));
  stats.setAttribute('role','group');
  stats.setAttribute('aria-label', `${totalMin} minutes played, ${avg} minutes average on play days, ${earned} marbles earned, ${spent} spent`);
  main.append(stats);

  const card = el('section','chart-card');
  const head = el('div','chart-head');
  const peek = ACTIVE_POINT!=null ? buckets[ACTIVE_POINT] : null;
  head.append(el('h3',null,'Minutes played'), el('div','big', peek ? `${peek.minutes} min` : `${totalMin} total`));
  card.append(head, buildChart(buckets), el('div','chart-help','Tap a day to see its minutes'));

}

function buildChart(buckets){
  const W=340, H=160, padL=24, padR=8, padT=16, padB=22;
  const n = buckets.length;
  const maxV = Math.max(20, ...buckets.map(b => b.minutes));
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (n===1 ? innerW/2 : (i/(n-1))*innerW);
  const y = v => padT + innerH - (v/maxV)*innerH;
  const ns = 'http://www.w3.org/2000/svg';
  const mkS = (tag, attrs) => { const e = document.createElementNS(ns, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const total = buckets.reduce((a,b) => a+b.minutes, 0);
  const svg = mkS('svg', { viewBox:`0 0 ${W} ${H}`, class:'chart-svg', role:'img', 'aria-label':`Minutes played per day, last ${n} days, ${total} in total` });

  [maxV, Math.round(maxV/2), 0].forEach(gv => {
    svg.append(mkS('line', { x1:padL, x2:W-padR, y1:y(gv), y2:y(gv), stroke:'#333a45', 'stroke-width':1, 'stroke-dasharray':'2 4' }));
    const t = mkS('text', { x:padL-5, y:y(gv)+3, class:'chart-ylabel' }); t.textContent = gv; svg.append(t);
  });
  const pts = buckets.map((b,i) => [x(i), y(b.minutes)]);
  const linePath = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const defs = mkS('defs', {}); defs.innerHTML = '<linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5a623"/><stop offset="100%" stop-color="#f5a623" stop-opacity="0"/></linearGradient>';
  svg.append(defs);
  svg.append(mkS('path', { d: linePath+` L ${pts[n-1][0].toFixed(1)} ${padT+innerH} L ${pts[0][0].toFixed(1)} ${padT+innerH} Z`, fill:'url(#areaGrad)', class:'chart-area' }));
  const line = mkS('path', { d:linePath, class:'chart-line' }); svg.append(line);
  if(CHART_ANIM){
    CHART_ANIM = false;
    requestAnimationFrame(() => { try{ const L = line.getTotalLength(); line.animate([{strokeDasharray:L, strokeDashoffset:L},{strokeDasharray:L, strokeDashoffset:0}], {duration:650, easing:'ease-out'}); }catch(e){} });
  }
  buckets.forEach((b,i) => {
    if((i%4===0 && n-1-i >= 3) || i===n-1){ const t = mkS('text', { x:x(i), y:H-5, class:'chart-xlabel' }); t.textContent = b.date.toLocaleDateString([], {day:'numeric', month:'numeric'}); svg.append(t); }
  });
  const colW = n>1 ? innerW/(n-1) : innerW;
  buckets.forEach((b,i) => {
    svg.append(mkS('circle', { cx:x(i), cy:y(b.minutes), r: ACTIVE_POINT===i ? 6 : 4, class:'chart-dot'+(ACTIVE_POINT===i?' active':'') }));
  });
  buckets.forEach((b,i) => {       // full-height tap columns: easy to hit with a finger
    const hit = mkS('rect', { x:x(i)-colW/2, y:0, width:colW, height:H-padB+4, class:'chart-hit'+(ACTIVE_POINT===i?' active':'') });
    hit.addEventListener('click', () => { ACTIVE_POINT = ACTIVE_POINT===i ? null : i; render(); });
    svg.append(hit);
  });
  if(ACTIVE_POINT!=null){
    const b = buckets[ACTIVE_POINT];
    const label = `${b.minutes} min · ${b.date.toLocaleDateString([], {weekday:'short'})}`;
    const bw = label.length*6.2 + 14;
    const tx = clamp(x(ACTIVE_POINT), padL+bw/2, W-bw/2), ty = Math.max(y(b.minutes)-14, 18);
    svg.append(mkS('rect', { x:tx-bw/2, y:ty-16, width:bw, height:20, rx:6, class:'chart-tipbg' }));
    const t = mkS('text', { x:tx, y:ty-2, class:'chart-tip' }); t.textContent = label; svg.append(t);
  }
  return svg;
}

/* ----------------------------- dialogs ------------------------------------ */
/* Native <dialog> + showModal(): focus trap, Esc / Android back, top layer.
   closedby="any" gives tap-outside-to-close; fallback for browsers without it. */
let dlg = null, dlgCleanups = [], lastFocus = null;
function openSheet(node, { dismissible=true, onClose }={}){
  teardownSheet(false);
  lastFocus = document.activeElement;
  const d = document.createElement('dialog'); d.className = 'sheet';
  d.setAttribute('closedby', dismissible ? 'any' : 'none');
  const h = node.querySelector('h2');
  if(h){ h.id = 'dlg-'+uid(); h.tabIndex = -1; h.autofocus = true; d.setAttribute('aria-labelledby', h.id); }  // focus title, not an input (no surprise keyboard)
  d.append(node); document.body.append(d);
  d.addEventListener('cancel', e => { if(!dismissible) e.preventDefault(); });
  d.addEventListener('close', () => { if(dlg === d) teardownSheet(true); });
  if(dismissible && !('closedBy' in HTMLDialogElement.prototype)){
    d.addEventListener('click', e => {
      if(e.target !== d) return;
      const r = d.getBoundingClientRect();
      if(e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) d.close();
    });
  }
  dlg = d; dlgCleanups = onClose ? [onClose] : [];
  d.showModal();
  return d;
}
function teardownSheet(restoreFocus){
  if(!dlg) return;
  const d = dlg; dlg = null;
  dlgCleanups.splice(0).forEach(f => { try{ f(); }catch(e){} });
  if(d.open) d.close();
  d.remove();
  if(restoreFocus && lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll:true });
}
function closeSheet(){ teardownSheet(true); }

function escapeHtml(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function requireGrownup(cb){
  if(Date.now() < UNLOCKED_UNTIL){ cb(); return; }
  promptPin(cb);
}

function pinPad({ title, sub, onEnter, dismissible=true, checkLock=false }){
  let entry = '', lockTimer = null;
  const wrap = el('div');
  const subEl = el('p','sub',sub);
  wrap.append(el('h2', null, title), subEl);
  const dots = el('div','pin-dots'); dots.setAttribute('aria-hidden','true');
  const status = el('div','sr-only'); status.setAttribute('aria-live','polite');
  const err = el('div','pin-err'); err.setAttribute('role','alert');
  const pad = el('div','keypad'); const keys = [];
  const draw = () => { dots.replaceChildren(...[0,1,2,3].map(i => el('div','pin-dot'+(i<entry.length?' on':'')))); status.textContent = `${entry.length} of 4 digits`; };
  const api = {
    error: msg => { err.textContent = msg; entry = ''; setTimeout(draw, 160); },
    reset: () => { entry = ''; err.textContent = ''; draw(); },
    setSub: t => { subEl.textContent = t; },
  };
  function locked(){
    if(!checkLock) return false;
    const left = Math.ceil((Store.get().lockUntil - Date.now())/1000);
    const on = left > 0;
    keys.forEach(k => { k.disabled = on; });
    if(on) err.textContent = `Too many wrong tries. Wait ${fmtClock(left)}.`;
    else if(err.dataset.lock) err.textContent = '';
    err.dataset.lock = on ? '1' : '';
    return on;
  }
  function press(k){
    if(locked()) return;
    if(k==='⌫'){ entry = entry.slice(0,-1); err.textContent = ''; draw(); return; }
    if(entry.length >= 4) return;
    entry += k; draw();
    if(entry.length === 4){ const e = entry; entry = ''; onEnter(e, api); locked(); }
  }
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
    if(k===''){ pad.append(el('div','key blank')); return; }
    const b = btn('key', k, () => press(k)); b.setAttribute('aria-label', k==='⌫' ? 'Delete' : k);
    keys.push(b); pad.append(b);
  });
  draw();
  wrap.append(dots, status, err, pad);
  if(dismissible) wrap.append(btn('btn ghost mt2', 'Cancel', closeSheet));
  const d = openSheet(wrap, { dismissible, onClose: () => clearInterval(lockTimer) });
  d.addEventListener('keydown', e => { if(/^\d$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('⌫'); });
  if(checkLock){ locked(); lockTimer = setInterval(locked, 1000); }
  return api;
}

function promptPin(onOk){
  pinPad({ title:'Grown-ups only', sub:'Enter the PIN.', checkLock:true, onEnter:(entry, api) => {
    const s = Store.get();
    if(Date.now() < s.lockUntil) return;
    if(entry === s.pin){
      Store.update(st => { st.pinFails = 0; st.lockLevel = 0; st.lockUntil = 0; });
      UNLOCKED_UNTIL = Date.now() + UNLOCK_GRACE_MS;
      closeSheet();
      if(s.pin === DEFAULT_PIN) changePin({ forced:true, then:onOk }); else onOk();
      return;
    }
    let lockedNow = false;
    Store.update(st => {
      st.pinFails += 1;
      if(st.pinFails >= PIN_MAX_FAILS){ st.lockLevel += 1; st.lockUntil = Date.now() + Math.min(60*2**(st.lockLevel-1), 900)*1000; st.pinFails = 0; lockedNow = true; }
    });
    api.error(lockedNow ? '' : `Wrong PIN. ${PIN_MAX_FAILS - Store.get().pinFails} tries left.`);
  }});
}

function changePin({ forced=false, dismissible=true, then }={}){
  let first = null;
  const startSub = forced ? 'Pick a 4-digit PIN only grown-ups know. 1234 is not allowed.' : 'Type a new 4-digit PIN.';
  pinPad({ title: forced ? 'Set your own PIN' : 'Change PIN', sub:startSub, dismissible, onEnter:(entry, api) => {
    if(first == null){
      if(entry === DEFAULT_PIN){ api.error('1234 is too easy to guess. Pick another.'); return; }
      first = entry; api.reset(); api.setSub('Type the same PIN again.'); return;
    }
    if(entry !== first){ first = null; api.setSub(startSub); api.error('The PINs did not match. Start again.'); return; }
    Store.update(s => { s.pin = entry; s.setupDone = true; s.pinFails = 0; s.lockUntil = 0; s.lockLevel = 0; });
    UNLOCKED_UNTIL = Date.now() + UNLOCK_GRACE_MS;
    closeSheet(); toast('PIN saved'); then && then();
  }});
}

  const draft = structuredClone(Store.get().goals);
  const wrap = el('div');
  wrap.append(el('h2', null, 'Savings goals'), el('p','sub','Rewards to save marbles for. Deleting a goal or lowering its price returns the extra marbles to the pot.'));
  const heads = el('div','col-heads'); heads.innerHTML = '<span>Reward</span><span style="width:74px">Price</span><span style="width:44px"></span>';
  const list = el('div','rate-list');
  function draw(){
    list.replaceChildren();
    draft.forEach((g,i) => {
      const item = el('div','goal-item');
      const name = Object.assign(el('input','gname'), { value:g.name, placeholder:'Reward', maxLength:40 });
      name.setAttribute('aria-label','Reward name'); name.oninput = () => { draft[i].name = name.value; };
      const cost = Object.assign(el('input','gcost'), { type:'number', min:'1', max:'99', value:g.cost, inputMode:'numeric' });
      cost.setAttribute('aria-label', `Price in marbles for ${g.name||'reward'}`);
      cost.onchange = () => { draft[i].cost = clamp(parseInt(cost.value,10)||1,1,99); cost.value = draft[i].cost; };
      const del = btn('del', '×', () => { draft.splice(i,1); draw(); }); del.setAttribute('aria-label', `Delete ${g.name||'reward'}`);
      item.append(name, cost, del); list.append(item);
      if(g.saved) list.append(el('div','goal-saved', `${plural(g.saved,'marble')} saved`));
    });
  }
  draw();
  wrap.append(heads, list, btn('btn ghost', '+ Add goal', () => { draft.push({ id:uid(), name:'New reward', cost:5, saved:0 }); draw(); }));
  wrap.append(btn('btn mt', 'Save', () => {
    const refund = applyGoals(draft); render();
    toast(refund ? `Saved · ${plural(refund,'marble')} back in the pot` : 'Saved');
    openGrownupsPanel();
  }));
  wrap.append(btn('btn ghost mt', 'Back', openGrownupsPanel));
  openSheet(wrap);
}

function openSettings(){
  const wrap = el('div');
  wrap.append(el('h2', null, 'PIN, sound & backup'));
  wrap.append(btn('btn ghost', 'Change PIN', () => changePin({ then:openSettings })));

  const snd = el('div','field mt2');
  const row = el('div'); row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px';
  const lab = el('div'); lab.innerHTML = '<div style="font-size:1rem">Timer sounds</div><div class="hint">Warning at 1 min and 10 s, chime + buzz when time is up.</div>';
  const toggle = btn('btn ghost', '', () => {
    Store.update(st => { st.soundOn = !(st.soundOn !== false); }); paint();
    if(Store.get().soundOn){ Sound.unlock(); Sound.warn(); }
  });
  toggle.style.cssText = 'width:80px;flex:0 0 auto;padding:11px';
  toggle.setAttribute('aria-label','Timer sounds');
  const paint = () => { const on = Store.get().soundOn !== false; toggle.textContent = on ? 'On' : 'Off'; toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    toggle.style.background = on ? 'linear-gradient(160deg,var(--glass-a),var(--glass-b) 70%)' : ''; toggle.style.color = on ? '#2a1500' : ''; };
  paint(); row.append(lab, toggle); snd.append(row); wrap.append(snd);

  const bk = el('div','field mt2');
  bk.append(el('div','field-label','Backup'));
  bk.append(btn('btn ghost', 'Show backup code', openBackup), btn('btn ghost mt', 'Restore from code', openRestore));
  bk.append(el('div','hint','Keep a backup code somewhere safe. Clearing app storage erases the marbles. The PIN is never in the code.'));
  wrap.append(bk);

  wrap.append(btn('btn danger mt2', 'Reset everything', () => confirmSheet({
    title:'Reset everything?', body:'This erases all marbles, goals, history and the PIN.', yes:'Erase all', no:'Cancel', danger:true,
    onYes: () => { Store.reset(); LAST_SHOWN = null; TAB = 'home'; UNLOCKED_UNTIL = 0; Timer.ensureLoop(); WakeLock.sync(); render(); showWelcome(); },
  })));
  wrap.append(btn('btn ghost mt', 'Back', openGrownupsPanel));
  openSheet(wrap);
}

function openBackup(){
  const code = backupCode();
  const wrap = el('div');
  wrap.append(el('h2', null, 'Backup code'), el('p','sub','Copy this and keep it somewhere safe, like a note or email to yourself.'));
  const f = el('div','field'); const ta = Object.assign(el('textarea'), { readOnly:true, value:code }); ta.setAttribute('aria-label','Backup code');
  f.append(ta); wrap.append(f);
  wrap.append(btn('btn', 'Copy', async () => {
    try{ await navigator.clipboard.writeText(code); toast('Backup copied'); }
    catch(e){ ta.focus(); ta.select(); toast('Selected. Copy it from the menu'); }
  }));
  wrap.append(btn('btn ghost mt', 'Back', openSettings));
  openSheet(wrap);
}

function openRestore(){
  const wrap = el('div');
  wrap.append(el('h2', null, 'Restore from code'), el('p','sub','Paste a backup code. Your current PIN stays the same.'));
  const f = el('div','field'); const ta = el('textarea'); ta.setAttribute('aria-label','Backup code to restore'); ta.placeholder = 'Paste code here';
  const err = el('div','cost-warn'); err.setAttribute('role','alert');
  f.append(ta, err); wrap.append(f);
  wrap.append(btn('btn', 'Restore', () => {
    const r = parseBackup(ta.value);
    if(!r.ok){ err.textContent = r.error; return; }
    const d = r.data, goals = Array.isArray(d.goals) ? d.goals.length : 0;
    confirmSheet({ title:'Replace current data?', yes:'Restore', no:'Cancel',
      body:`Now: ${plural(Store.get().marbles,'marble')}. Backup: ${plural(d.marbles,'marble')}, ${plural(goals,'goal')}.`,
      onYes: () => { applyRestore(d); toast('Restored'); } });
  }));
  wrap.append(btn('btn ghost mt', 'Back', openSettings));
  openSheet(wrap);
}

/* ----------------------------- misc UI ------------------------------------ */
function toast(msg){
  const t = el('div','toast',msg); t.setAttribute('role','status');
  // Inside an open modal dialog, content outside it is inert (not announced), so
  // the toast goes into the dialog; as a popover it still paints above everything.
  (dlg && dlg.open ? dlg : document.body).append(t);
  if(t.showPopover){ t.popover = 'manual'; try{ t.showPopover(); }catch(e){} }
  setTimeout(() => t.remove(), 2200);
}
function showSplash(title, sub){
  const sp = el('div','splash'); sp.setAttribute('role','status');
  sp.append(el('div','big-marble'), el('h2','display',title), el('p',null,sub));
  document.body.append(sp);
  sp.addEventListener('click', () => sp.remove());
  setTimeout(() => sp.remove(), 2600);
}

/* test hooks */
window.__marbles = { Store, Timer, Sound, WakeLock, spendMarble, endSession, addToBank, withdrawFromGoal, claimGoal,
  grantMarbles, removeMarbles, applyGoals, applyActivities, backupCode, parseBackup, applyRestore,
  dailyBuckets, costFor, snap10, fmtClock, fmtWhen, b64enc, b64dec };

/* ----------------------------- boot --------------------------------------- */
Store.load();
render();
WakeLock.sync();
if(!Store.get().setupDone) showWelcome();

window.addEventListener('storage', () => { Store.load(); render(); });
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ UNLOCKED_UNTIL = 0; if(TAB==='usage') TAB = 'home'; WakeLock.sync(); return; }
  Store.load(); render(); Timer.tick(); WakeLock.sync();   // tick now: plays at most one catch-up cue
});

/* ----------------------------- PWA ---------------------------------------- */
(function setupPWA(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if(!p) navigator.storage.persist(); }); }catch(e){}
  try{
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) Promise.reject().catch(()=>{});
  }catch(e){}
})();
</script>
